name: Build Netflux Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Live Netflux server URL embedded in the APK'
        required: false
        default: 'https://ais-pre-euj3wxuef7xp3b57twk4en-706784507558.europe-west2.run.app'

permissions:
  contents: write

jobs:
  verify-web:
    name: Verify Web App (TypeScript, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run logic unit tests
        run: ./node_modules/.bin/tsx --test src/services/logic.test.ts

      - name: Build production web bundle
        run: npm run build

      - name: Verify production server startup
        run: |
          NODE_ENV=production PORT=3999 node server.ts > /tmp/ci-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3999/ > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3999/ > /dev/null || { cat /tmp/ci-server.log; exit 1; }
          curl -sf http://127.0.0.1:3999/api/tmdb/health > /dev/null || { cat /tmp/ci-server.log; exit 1; }

  build-apk:
    name: Build Installable Android APK
    needs: verify-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35 & Licenses
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "Using ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ] && [ ! -w "$ANDROID_HOME" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" || true
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found on runner"
            exit 1
          fi
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sync Android launcher icons from PWA assets
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi \
                   android/app/src/main/res/mipmap-hdpi \
                   android/app/src/main/res/mipmap-xhdpi \
                   android/app/src/main/res/mipmap-xxhdpi \
                   android/app/src/main/res/mipmap-xxxhdpi
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Resolve APK target URL
        id: resolve_url
        shell: bash
        env:
          INPUT_URL: ${{ inputs.app_url }}
          VAR_URL: ${{ vars.APP_URL }}
        run: |
          TARGET_URL="$INPUT_URL"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$VAR_URL"
          fi
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://ais-pre-euj3wxuef7xp3b57twk4en-706784507558.europe-west2.run.app"
          fi
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"

      - name: Decode optional release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "path=${{ runner.temp }}/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Netflux APK
        id: gradle_build
        working-directory: android
        env:
          NETFLUX_APP_URL: ${{ steps.resolve_url.outputs.url }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --version
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            gradle assembleDebug --no-daemon --stacktrace
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p apk-output
          APK_SOURCE="${{ steps.gradle_build.outputs.apk_path }}"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "APK not found at $APK_SOURCE"
            find android/app/build/outputs -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi
          cp "$APK_SOURCE" "apk-output/Netflux.apk"
          ls -lh apk-output/

      - name: Upload Netflux APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netflux-Android-APK
          path: apk-output/Netflux.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download to GitHub Releases
        id: publish_release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="Netflux Android APK (Latest)"
          NOTES="Direct Android APK download for Netflux (Build #${{ github.run_number }}). Tap **Netflux.apk** under Assets below to download and install directly on Android."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" apk-output/Netflux.apk --clobber
          else
            gh release create "$TAG" apk-output/Netflux.apk \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Add mobile-friendly APK download summary
        run: |
          {
            echo "## Netflux Android APK Ready"
            echo ""
            echo "- **Direct APK Download (1-tap on Android, no ZIP):** https://github.com/${{ github.repository }}/releases/download/latest/Netflux.apk"
            echo "- **Releases Page:** https://github.com/${{ github.repository }}/releases/tag/latest"
            echo "- **Actions Artifact (ZIP):** Scroll the **Artifacts** row right past the copy-SHA256 button (or switch browser to **Desktop site**) to reveal the Download button for \`Netflux-Android-APK\`."
          } >> "$GITHUB_STEP_SUMMARY"
